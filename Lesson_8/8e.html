<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber Ride</title>
</head>
<style>
    input {
        height: 40px;
        width: 280px;
        color: grey;
        display: block;
        margin-top: 2px;
        border-radius: 4px;
    }
    .request {
        height: 36px;
        width: 130px;
        background-color: black;
        color: white;
        margin-top: 7px;
    }
    .later {
        height: 36px;
        width: 130px;
        background-color: white;
        color: black;
        margin-top: 7px;
    }
</style>
<body>
    <h1> Request a ride now </h1>
    <input type="text" placeholder="Enter pickup Location">
    <input type="text" placeholder="Enter destination">
    <button class="request"> Request now </button>
    <button class="later"> Schedule for later </button>
</body>
</html>
