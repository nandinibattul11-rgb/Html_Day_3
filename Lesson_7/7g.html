<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Circle</title>
</head>
<style>
    .cat {
        height: 100px;
        width: 100px;
        border-radius: 50%;
        display: inline-block;
        vertical-align: middle;
    }
    .t1 {
        display: inline-block;
        vertical-align: middle;
        margin-left: 10px;
    }
    button {
        background-color: #1E90FF;
        color: white;
        font-weight: bold;
        border-radius: 30px;
        border: none;
        height: 30px;
        width: 75px;
        margin-left: 250px;
    }
</style>
<body>
    <img  class="cat" src="cat.jpg"></img>
    <p class="t1"> What's happening? </p>
    <button> Tweet </button>
</body>
</html>
